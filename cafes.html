<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#fafafa;
    color:#333;
}

header{
    background:#111;
    padding:18px;
    text-align:center;
}

header a{
    color:white;
    text-decoration:none;
    font-weight:600;
    margin:0 18px;
}

.hero{
    height:40vh;
    background:
    linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),
    url("Images/hero.jpg");
    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    text-align:center;
}

.hero h1{
    font-size:55px;
}

.section{
    padding:70px 20px;
    max-width:1100px;
    margin:auto;
}

.featured-card{
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,.12);
}

.featured-card img{
    width:100%;
    display:block;
}

.featured-content{
    padding:25px;
}

.watch-btn{
    display:inline-block;
    margin-top:20px;
    background:#E1306C;
    color:white;
    text-decoration:none;
    padding:12px 22px;
    border-radius:8px;
}

footer{
    background:#111;
    color:white;
    text-align:center;
    padding:30px;
    margin-top:60px;
}

@media(max-width:768px){

.hero h1{
    font-size:36px;
}

}
